# rio on the Akuma panel (2026-10-05). Backup of the previous file:
# /root/.config/rio/config.toml.bak
shell = { program = "/bin/sh" }
# Esc, Q quits without the "are you sure" screen
confirm-before-quit = false

[fonts]
# kernel console cell is 20x40; 27 gives a ~34 px line, 15% smaller
size = 27.0
family = "Source Code Pro"

# Two sessions side by side. The right half of this panel is dead, so
# Esc, S swaps the sessions and keeps the active one on the left.
# Keys: press and release Esc, then the letter. (The console cannot send
# Super or Ctrl+Shift, and the kernel drops Alt; the bindings below say
# "alt" because a terminal sends Alt+x as ESC then x - over ssh real Alt works.)
#   Esc, D  split (new session on the right)    Esc, S  swap: other session to the left, focused
#   Esc, N  focus the other pane                Esc, W  close the focused pane
#   Esc, Q  quit rio                            exit / Ctrl+D  end the shell (closes its pane;
#                                                              rio quits with the last one)
[navigation]
mode = "Plain"
use-split = true
unfocused-split-opacity = 0.6

[bindings]
keys = [
  { key = "d", with = "alt", action = "SplitRight" },
  { key = "s", with = "alt", action = "SwapSplit" },
  { key = "n", with = "alt", action = "SelectNextSplit" },
  { key = "w", with = "alt", action = "CloseSplitOrTab" },
  { key = "q", with = "alt", action = "Quit" },
]

# --- CRT look: scanlines + green phosphor ------------------------------------
# To turn it ALL off: delete everything from here to "end CRT look" and
# restart rio (default theme, clean picture).
# The filter: "akuma-crt-2" = two curved tubes (fish-eye), one per pane;
# "-flat" = no curvature, keeps scanlines, vignette and beam softness;
# "akuma-crt" = one tube. Delete the [renderer] table for no effect at all
# (colours and cursor stay).
[renderer]
filters = ["akuma-crt-2-flat"]

[colors]
background = "#050a05"
foreground = "#33ff66"
cursor = "#33ff66"
vi-cursor = "#33ff66"
selection-background = "#1a5c2a"
selection-foreground = "#b8ffc8"
split = "#0f2a14"
split-active = "#33ff66"
black = "#050a05"
red = "#7dff8f"
green = "#33ff66"
yellow = "#a8ff3e"
blue = "#20b850"
magenta = "#5cff9d"
cyan = "#66ffcc"
white = "#c8ffd4"
light-black = "#1f5a2c"
light-red = "#a6ffb3"
light-green = "#7dff9e"
light-yellow = "#d4ff80"
light-blue = "#48d878"
light-magenta = "#8dffbd"
light-cyan = "#99ffe0"
light-white = "#eaffef"
dim-black = "#030603"
dim-red = "#3d8a47"
dim-green = "#1a8a3a"
dim-yellow = "#5a8a20"
dim-blue = "#106030"
dim-magenta = "#2e8a52"
dim-cyan = "#338a6e"
dim-white = "#6a8a70"
dim-foreground = "#1a8a3a"
# end CRT look
